[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "helios-xd3v3-button-editor"
version = "0.2.0"
description = "Unofficial Linux configuration editor for the Fantech Helios II XD3v3 mouse"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Reinazhard" },
]
keywords = ["fantech", "helios", "xd3v3", "mouse", "hid", "hidraw", "linux", "reverse-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Hardware",
  "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[project.scripts]
helios-editor = "helios_editor.cli:main"
punktech = "helios_editor.cli:main"

[project.urls]
Homepage = "https://github.com/Reinazhard/FantechXD3v3Linux"
Repository = "https://github.com/Reinazhard/FantechXD3v3Linux"
Issues = "https://github.com/Reinazhard/FantechXD3v3Linux/issues"
Changelog = "https://github.com/Reinazhard/FantechXD3v3Linux/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helios_editor = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
